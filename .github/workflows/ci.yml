name: CI

# Runs on every push and pull request. Previously the only workflow was
# release.yml (tag-triggered), so a broken build could only be discovered by
# publishing it to users.

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.2'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-bundle:
    name: Build & Verify Bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Cache bundled runtime downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('bin/deps_manifest.json') }}

      - name: Fetch and verify bundled runtime
        shell: pwsh
        run: ./tools/fetch-deps.ps1

      - name: Build Windows Application
        run: flutter build windows --release --dart-define=APP_VERSION=0.0.0-ci

      # Exercises the exact staging the release does, so a packaging regression
      # is caught here rather than in a published artifact.
      - name: Stage and verify bundle
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $ReleaseDir)) { throw "Build output not found at $ReleaseDir" }
          $stage = "dist/streamlink-gui-ci"
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "$ReleaseDir/*" -Destination $stage -Recurse -Force
          # Guard against a stale bin/ in the build output nesting as bin/bin/.
          if (Test-Path "$stage/bin") { Remove-Item "$stage/bin" -Recurse -Force }
          Copy-Item -Path "bin" -Destination "$stage/bin" -Recurse -Force
          ./tools/verify-bundle.ps1 -Root $stage
