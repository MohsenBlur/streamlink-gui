name: Automated Release & Build Pipeline

# Triggered by pushing a version tag, e.g. `git tag v1.0.61 && git push origin v1.0.61`.
#
# The tag is the authority for what gets published (previously the tag name was
# re-derived from pubspec.yaml, so a tag/pubspec desync would silently republish
# onto the OLDER release and destroy its already-published asset).

on:
  push:
    tags:
      - 'v*'

# Third-party actions are pinned to commit SHAs: this workflow holds `contents: write`,
# so a compromised mutable tag would be a publish-capable supply-chain hole.
jobs:
  build-release:
    name: Build Windows Release & Publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the pinned Flutter version
        id: sdk
        shell: bash
        run: |
          # tools/flutter-sdk.json is the single source of truth, shared with
          # setup.ps1 - a version pinned here as well would silently drift.
          version=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' tools/flutter-sdk.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          if [ -z "$version" ]; then
            echo 'Could not read version from tools/flutter-sdk.json' >&2
            exit 1
          fi
          echo "flutter=$version" >> "$GITHUB_OUTPUT"
        with:
          fetch-depth: 0

      - name: Verify tag matches pubspec version
        id: version
        shell: pwsh
        run: |
          $raw = Get-Content pubspec.yaml -Raw
          if ($raw -notmatch '(?m)^version:\s*(\S+)\s*$') {
            throw "Could not find a 'version:' line in pubspec.yaml"
          }
          $version = $Matches[1].Trim()

          # A build-number suffix (1.2.3+4) would poison the tag and, because the
          # client compares numerically, could freeze updates for every user.
          if ($version -match '\+') {
            throw "pubspec version '$version' has a build-number suffix. Use a plain x.y.z version."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "pubspec version '$version' is not a plain x.y.z version."
          }

          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw @"
          Tag / pubspec mismatch.
            pushed tag:      $tag
            pubspec version: $version  (expected tag 'v$version')
          Publishing would overwrite the wrong release. Bump pubspec.yaml and re-tag.
          "@
          }

          Write-Host "Publishing $tag (pubspec $version)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "stage=streamlink-gui-$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.sdk.outputs.flutter }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Cache bundled runtime downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('bin/deps_manifest.json') }}

      # The bundled executables are not committed to git. Without this step the
      # release ships a bin/ with no interpreter, no streamlink, no ffmpeg and no
      # yt-dlp - which is exactly how 18 consecutive releases shipped broken.
      - name: Fetch and verify bundled runtime
        shell: pwsh
        run: ./tools/fetch-deps.ps1

      - name: Build Windows Application
        run: flutter build windows --release --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Stage release bundle
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $ReleaseDir)) { throw "Build output not found at $ReleaseDir" }

          $stage = "dist/${{ steps.version.outputs.stage }}"
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -Path "$ReleaseDir/*" -Destination $stage -Recurse -Force

          # The build output can carry a stale bin/ from an earlier local packaging
          # run. Copying the fresh bin/ on top of an existing directory makes
          # PowerShell nest it as bin/bin/, which silently produces a bundle whose
          # runtime is one level too deep and therefore unreachable at runtime.
          if (Test-Path "$stage/bin") { Remove-Item "$stage/bin" -Recurse -Force }
          Copy-Item -Path "bin" -Destination "$stage/bin" -Recurse -Force

      - name: Verify staged bundle
        shell: pwsh
        run: ./tools/verify-bundle.ps1 -Root "dist/${{ steps.version.outputs.stage }}"

      - name: Package Release Zip
        shell: pwsh
        run: |
          $zip = "streamlink-gui-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # 7z rather than Compress-Archive: ~2300 files / ~280 MB is painfully slow
          # and memory-hungry through Windows PowerShell's archive cmdlets.
          & 7z a -tzip -mx=5 -bso0 -bsp0 $zip "./dist/${{ steps.version.outputs.stage }}" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          Write-Host ("Packaged {0:N1} MB" -f ((Get-Item $zip).Length / 1MB))

      - name: Verify packaged zip
        shell: pwsh
        run: ./tools/verify-bundle.ps1 -Zip "streamlink-gui-windows.zip" -Prefix "${{ steps.version.outputs.stage }}"

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "streamlink-gui-windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          # LF, no BOM. Out-File wrote CRLF, which leaves a stray \r on the
          # filename field and makes `sha256sum -c SHA256SUMS` report the file
          # as unreadable - the digest was fine, but anyone verifying the
          # download by hand saw a failure. (The in-app updater is unaffected:
          # it extracts the digest by regex and ignores the filename.)
          $line = "$hash  streamlink-gui-windows.zip`n"
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "SHA256SUMS"),
            $line,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content "SHA256SUMS"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            streamlink-gui-windows.zip
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
